name: Refresh swipe file media

# Apify is pay-per-result, so the two jobs run on different cadences:
#  - links:    every 3 days — Meta media links expire after ~4-5 days.
#  - discover: weekly, Thursday night — new top ads for the Friday review.
# Only swipe/swipe.json changes; no media files are stored.
on:
  schedule:
    - cron: "0 11 */3 * *"   # links — ~8am local (UTC-3), every 3rd day of the month
    - cron: "0 1 * * 5"      # discover — Thu ~10pm local (Fri 01:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "links | discover | all"
        default: "all"

permissions:
  contents: write

concurrency:
  group: refresh-swipe
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ github.event.inputs.mode }}";
          elif [ "${{ github.event.schedule }}" = "0 1 * * 5" ]; then m="discover";
          else m="links"; fi
          echo "mode=${m:-all}" >> "$GITHUB_OUTPUT"
      - name: Pull from Apify (${{ steps.mode.outputs.mode }})
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/refresh_swipe.py "${{ steps.mode.outputs.mode }}"
      - name: Commit if changed
        run: |
          git config user.name "swipe-refresh-bot"
          git config user.email "swipe-refresh-bot@users.noreply.github.com"
          git add swipe/swipe.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Swipe file ${{ steps.mode.outputs.mode }} refresh ($(date -u +%F))"
          git pull --rebase
          git push
